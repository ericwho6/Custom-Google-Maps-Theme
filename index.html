<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>One Piece Journey</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="map"></div>

  <header class="banner">
    <h1>Eric's Log Pose</h1>
    <p>Every stop on my voyage so far</p>
  </header>

  <div id="login">
    <div class="login-box">
      <h2>Eric's Log Pose</h2>
      <p>Enter your crew login to board.</p>
      <input id="user" placeholder="Username" autocomplete="username" />
      <input id="pass" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="loginBtn">Set sail</button>
      <p id="loginError"></p>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="login.js"></script>
</body>
</html>
